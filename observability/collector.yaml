# One agent per application host. Environment labels must match the platform registry.
receivers:
  hostmetrics:
    collection_interval: 10s
    root_path: /hostfs
    scrapers:
      cpu: {}
      memory:
        metrics:
          system.memory.limit:
            enabled: true
          system.linux.memory.available:
            enabled: true
      filesystem:
        include_mount_points:
          mount_points: [/]
          match_type: strict
      disk:
        exclude:
          devices: ['^loop.*', '^ram.*', '^dm-.*']
          match_type: regexp
      network:
        exclude:
          interfaces: ['^lo$', '^veth.*', '^docker.*', '^br-.*']
          match_type: regexp
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24
  resource:
    attributes:
      - key: application.id
        value: ${env:OTEL_APPLICATION_ID}
        action: upsert
      - key: deployment.environment.name
        value: ${env:SERVED_BY}
        action: upsert
      - key: host.name
        value: ${env:OTEL_HOST_NAME}
        action: upsert
      - key: service.name
        value: foxtrot-app-host
        action: upsert
  batch:
    timeout: 1s
exporters:
  otlp_http:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:OTEL_INGEST_TOKEN}
    sending_queue:
      queue_size: 128
    retry_on_failure:
      max_elapsed_time: 1m
service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
